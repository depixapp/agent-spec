name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Re-verify the signing vectors (so they can't rot), prove they regenerate
  # exactly, run the Node examples, and check for drift against the live sources.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-verify signing vectors
        run: node scripts/verify-vectors.mjs
      - name: Vectors reproduce exactly (no hand-edit drift)
        run: node scripts/gen-vectors.mjs --check
      - name: Example — verify webhook (Node)
        run: node examples/verify-webhook/node/verify.mjs
      - name: Example — sign request (Node)
        run: node examples/sign-request/node/sign.mjs
      - name: Drift guard against live canonical sources
        run: node scripts/pull-canonical.mjs

  # The verify example in Python (independent Ed25519/HMAC implementation).
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cryptography
        run: python -m pip install --quiet cryptography
      - name: Example — verify webhook (Python)
        run: python3 examples/verify-webhook/python/verify.py
      - name: Example — sign request (Python)
        run: python3 examples/sign-request/python/sign.py

  # The verify example in Go (stdlib crypto).
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Example — verify webhook (Go)
        working-directory: examples/verify-webhook/go
        run: go run .
